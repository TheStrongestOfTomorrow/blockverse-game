<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="blast_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#00bfff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0044ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Outer glow -->
  <circle cx="32" cy="32" r="30" fill="url(#blast_glow)"/>
  <!-- Concentric blast rings -->
  <ellipse cx="28" cy="28" rx="20" ry="12" fill="none" stroke="#00bfff" stroke-width="2" stroke-dasharray="3,2" transform="rotate(-30, 28, 28)"/>
  <ellipse cx="28" cy="28" rx="14" ry="8" fill="none" stroke="#00ffff" stroke-width="2" transform="rotate(-30, 28, 28)"/>
  <ellipse cx="28" cy="28" rx="8" ry="4" fill="none" stroke="#ffffff" stroke-width="2.5" transform="rotate(-30, 28, 28)"/>
  <!-- Central impact core -->
  <circle cx="28" cy="28" r="5" fill="#ffffff"/>
  <!-- Repulsor rays -->
  <line x1="32" y1="28" x2="52" y2="24" stroke="#00bfff" stroke-width="2" opacity="0.6"/>
  <line x1="30" y1="26" x2="48" y2="18" stroke="#00ffff" stroke-width="1.5" opacity="0.4"/>
  <line x1="34" y1="30" x2="54" y2="30" stroke="#00bfff" stroke-width="1.5" opacity="0.5"/>
  <line x1="30" y1="30" x2="50" y2="36" stroke="#00ffff" stroke-width="1.5" opacity="0.4"/>
  <!-- Energy particles -->
  <circle cx="44" cy="20" r="1.5" fill="#00ffff" opacity="0.7"/>
  <circle cx="48" cy="28" r="1" fill="#ffffff" opacity="0.8"/>
  <circle cx="46" cy="36" r="1.5" fill="#00bfff" opacity="0.6"/>
  <circle cx="40" cy="16" r="1" fill="#00ffff" opacity="0.5"/>
  <!-- Small trailing sparks -->
  <circle cx="36" cy="24" r="1" fill="#ffd700" opacity="0.6"/>
  <circle cx="38" cy="30" r="0.8" fill="#ffffff" opacity="0.7"/>
</svg>