<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#00bfff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </radialGradient>
  </defs>
  <!-- Outer glow -->
  <circle cx="32" cy="32" r="30" fill="url(#glow)"/>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#c41e3a" stroke-width="3"/>
  <circle cx="32" cy="32" r="23" fill="none" stroke="#ffd700" stroke-width="1.5"/>
  <!-- Inner ring -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-dasharray="4,3"/>
  <!-- Core circle -->
  <circle cx="32" cy="32" r="12" fill="url(#core)"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="4" fill="#ffffff"/>
  <!-- Arc reactor lines -->
  <line x1="20" y1="32" x2="14" y2="32" stroke="#00d4ff" stroke-width="2"/>
  <line x1="44" y1="32" x2="50" y2="32" stroke="#00d4ff" stroke-width="2"/>
  <line x1="32" y1="20" x2="32" y2="14" stroke="#00d4ff" stroke-width="2"/>
  <line x1="32" y1="44" x2="32" y2="50" stroke="#00d4ff" stroke-width="2"/>
  <!-- Small decorative nodes -->
  <circle cx="16" cy="26" r="2" fill="#ffd700"/>
  <circle cx="48" cy="26" r="2" fill="#ffd700"/>
  <circle cx="16" cy="38" r="2" fill="#ffd700"/>
  <circle cx="48" cy="38" r="2" fill="#ffd700"/>
  <circle cx="26" cy="16" r="2" fill="#ffd700"/>
  <circle cx="38" cy="16" r="2" fill="#ffd700"/>
  <circle cx="26" cy="48" r="2" fill="#ffd700"/>
  <circle cx="38" cy="48" r="2" fill="#ffd700"/>
</svg>